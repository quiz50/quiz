<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz50--By Sanjeet</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Poppins', sans-serif;
            background: linear-gradient(135deg,#667eea,#764ba2);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
            color:#fff;
        }
        #loader {
            border:16px solid rgba(255,255,255,0.3);
            border-radius:50%;
            border-top:16px solid #ff6a00;
            width:120px; height:120px;
            animation:spin 1.5s linear infinite;
            margin:auto;
        }
        @keyframes spin {0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
        #selectionContainer {
            display:none;
            background:rgba(255,255,255,0.1);
            backdrop-filter:blur(12px);
            border-radius:16px;
            padding:30px 25px;
            width:100%;
            max-width:400px;
            text-align:center;
            box-shadow:0 8px 20px rgba(0,0,0,0.3);
        }
        #selectionContainer h1 { font-size:28px; margin-bottom:20px; }
        .dropdown { margin:15px 0; text-align:left; }
        .dropdown label { display:block; margin-bottom:6px; font-weight:600; }
        select { width:100%; padding:12px; border-radius:8px; border:none; outline:none; background:rgba(255,255,255,0.9); color:#333; font-size:16px; }
        select:focus { background:#fff; transform:scale(1.02); }
        button {
            width:100%; margin-top:20px; padding:14px; font-size:18px;
            font-weight:600; border:none; border-radius:10px; cursor:pointer;
            background:#ff6a00; color:#fff; transition:0.3s ease;
        }
        button:hover { background:#ff8c42; transform:translateY(-2px); box-shadow:0 6px 15px rgba(0,0,0,0.2);}
        @media (max-width:500px) { #selectionContainer { padding:20px; } #selectionContainer h1 { font-size:22px; } button { font-size:16px; } }
    </style>
</head>
<body>
    <div id="loader"></div>

    <div id="selectionContainer">
        <h1>Welcome Dear Learner</h1>

        <div class="dropdown">
            <label for="class">Class</label>
            <select id="class">
                <option value="">-- Select Class --</option>
            </select>
        </div>

        <div class="dropdown">
            <label for="subject">Subject</label>
            <select id="subject" disabled>
                <option value="">-- Select Subject --</option>
            </select>
        </div>

        <div class="dropdown">
            <label for="chapter">Chapter</label>
            <select id="chapter" disabled>
                <option value="">-- Select Chapter --</option>
            </select>
        </div>

        <button id="startBtn" disabled>Start Quiz</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const classSelect = document.getElementById("class");
            const subjectSelect = document.getElementById("subject");
            const chapterSelect = document.getElementById("chapter");
            const startBtn = document.getElementById("startBtn");
            const loader = document.getElementById("loader");
            const selectionContainer = document.getElementById("selectionContainer");

            const scriptUrl = 'https://script.google.com/macros/s/AKfycbywh0JQwRLJNzQIDJzfF0FWX-krbQGgQjRVfSNSQ0jdqJnV6rNVGDKSNawTle-9-lzhvg/exec';

            try {
                let formData;
                const storedData = sessionStorage.getItem('quizFormData');
                if (storedData) {
                    formData = JSON.parse(storedData);
                } else {
                    const response = await fetch(scriptUrl);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    formData = await response.json();
                    sessionStorage.setItem('quizFormData', JSON.stringify(formData));
                }

                loader.style.display = "none";
                selectionContainer.style.display = "block";

                // Populate class dropdown
                formData.forEach(cls => {
                    const opt = document.createElement("option");
                    opt.value = cls.class;
                    opt.textContent = cls.class;
                    classSelect.appendChild(opt);
                });

                let selectedClassData = null;

                classSelect.addEventListener("change", function () {
                    const clsName = classSelect.value;
                    selectedClassData = formData.find(item => item.class === clsName);

                    subjectSelect.innerHTML = '<option value="">-- Select Subject --</option>';
                    chapterSelect.innerHTML = '<option value="">-- Select Chapter --</option>';
                    subjectSelect.disabled = true;
                    chapterSelect.disabled = true;
                    startBtn.disabled = true;

                    if (selectedClassData) {
                        Object.keys(selectedClassData.subjects).forEach(subject => {
                            const opt = document.createElement("option");
                            opt.value = subject;
                            opt.textContent = subject;
                            subjectSelect.appendChild(opt);
                        });
                        subjectSelect.disabled = false;
                    }
                });

                subjectSelect.addEventListener("change", function () {
                    const subName = subjectSelect.value;
                    chapterSelect.innerHTML = '<option value="">-- Select Chapter --</option>';
                    chapterSelect.disabled = true;
                    startBtn.disabled = true;

                    if (selectedClassData && selectedClassData.subjects[subName]) {
                        selectedClassData.subjects[subName].forEach(ch => {
                            const opt = document.createElement("option");
                            opt.value = ch;
                            opt.textContent = ch;
                            chapterSelect.appendChild(opt);
                        });
                        chapterSelect.disabled = false;
                    }
                });

                chapterSelect.addEventListener("change", function () {
                    startBtn.disabled = !chapterSelect.value;
                });

                startBtn.addEventListener("click", function () {
                    const cls = classSelect.value.trim();
                    const sub = subjectSelect.value.trim();
                    let ch = chapterSelect.value.trim();

                    if (!cls || !sub || !ch) {
                        alert("Please select all fields.");
                        return;
                    }

                    // Convert chapter to URL-friendly format
                    if (/all/i.test(ch)) {
                        ch = "ChAll";
                    } else {
                        const match = ch.match(/\d+/);
                        ch = match ? `Ch${match[0]}` : ch;
                    }

                    const subjectParam = cls.replace("Class", "cl").replace(/\s/g,'') + "sub" + sub.replace(/\s/g,'') + ch;

                    window.location.href = `quizPage.html?subject=${encodeURIComponent(subjectParam)}`;
                });

            } catch (error) {
                loader.style.display = "none";
                alert("Failed to load quiz data.");
                console.error("Error fetching data:", error);
            }
        });
    </script>
</body>
</html>
